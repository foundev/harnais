name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64; do
            GOOS="${target%%/*}"
            GOARCH="${target##*/}"
            # env on the command line, not exported shell vars: only that
            # reaches the go build child process, so each target actually
            # cross-compiles instead of rebuilding the host platform.
            env GOOS="$GOOS" GOARCH="$GOARCH" \
            go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/harnais_${GOOS}_${GOARCH}" \
              .
          done
          cd dist
          # Archive each binary, then remove it: dist must hold only
          # archives, or the Release step uploads every binary twice.
          for f in harnais_*; do
            if [[ "$f" == *windows* ]]; then
              mv "$f" "$f.exe"
              zip -q "${f}.zip" "$f.exe"
              rm "$f.exe"
            else
              tar -czf "$f.tar.gz" "$f"
              rm "$f"
            fi
          done

      - name: Verify archives
        # The cross-compile used to silently no-op and ship five copies
        # of the host binary; check each archive holds a binary its name
        # vouches for before anything reaches the release page.
        run: |
          failed=0
          for a in dist/harnais_*.tar.gz dist/harnais_*.zip; do
            name="$(basename "$a" | sed 's/\.tar\.gz$//; s/\.zip$//')"
            os="${name#harnais_}"; os="${os%_*}"
            want="ELF"
            [[ "$os" == darwin* ]] && want="Mach-O"
            [[ "$os" == windows* ]] && want="PE32+"
            d="$(mktemp -d)"
            case "$a" in
              *.zip) unzip -q "$a" -d "$d" ;;
              *) tar -xzf "$a" -C "$d" ;;
            esac
            got="$(file "$d"/harnais* | cut -d: -f2-)"
            if [[ "$got" != *"$want"* ]]; then
              echo "::error::$name holds a $got — expected $want"
              failed=1
            fi
          done
          exit "$failed"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          # Only archives live in dist at this point (see the rm above);
          # the glob stays narrow so a stray file cannot leak in.
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
